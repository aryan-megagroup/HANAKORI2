version: '3.8'

services:
  # Go Microservice Layer
  web:
    build: .
    container_name: hanakori_app
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    depends_on:
      db:
        condition: service_healthy

  # Database Engine Layer
  db:
    image: mysql:8.0
    container_name: hanakori_db
    ports:
      - "3307:3306"          
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_USER=user_hanakori     
      - MYSQL_PASSWORD=userpassword 
      - MYSQL_DATABASE=hanakori_db   
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data: