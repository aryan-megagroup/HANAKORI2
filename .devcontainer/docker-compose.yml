version: "3.8"

services:
  web:
    image: mcr.microsoft.com/devcontainers/go:1-1.25-alpine
    container_name: hanakori_dev_workspace
    volumes:
      - ..:/app:cached
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: hanakori_dev_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_dev_data:
